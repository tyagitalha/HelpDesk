<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Details</title>

   
    <link rel="stylesheet" href="../css/admin-ticket.css">
    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header>

        <nav>

            <a href="dashboard.html">
                HelpDesk Admin
            </a>

            <div>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="tickets.html">
                    All Tickets
                </a>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </nav>

    </header>


    <main>

        <section>

            <a href="tickets.html">
                ← Back to Tickets
            </a>

        </section>


        <section id="ticketDetails">

        </section>


        <section class="admin-controls">

            <h2>
                Manage Ticket
            </h2>


            <div>

                <label for="statusSelect">
                    Status
                </label>

                <select id="statusSelect">

                    <option value="open">
                        Open
                    </option>

                    <option value="in-progress">
                        In Progress
                    </option>

                    <option value="resolved">
                        Resolved
                    </option>

                    <option value="closed">
                        Closed
                    </option>

                </select>

            </div>


            <div>

                <label for="prioritySelect">
                    Priority
                </label>

                <select id="prioritySelect">

                    <option value="low">
                        Low
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="high">
                        High
                    </option>

                </select>

            </div>


            <div>

                <label for="assignedTo">
                    Assign To
                </label>

                <select id="assignedTo">

                   

                </select>

            </div>


            <button id="updateTicketBtn" type="button">
                Update Ticket
            </button>


            <p id="updateMessage"></p>

        </section>


        <section>

            <h2>
                Conversation
            </h2>


            <div id="commentsList">
             
            </div>


            <form id="commentForm">

                <textarea id="commentInput" placeholder="Write a comment..." required></textarea>

                <button type="submit" id="commentBtn">
                    Send Comment
                </button>

            </form>

        </section>

    </main>


    <script src="../js/logout.js"></script>
     <script src="../js/admin-details.js"></script>
</body>

</html>
