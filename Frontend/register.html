<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register User</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="auth-conatiner">
        <form id="registerForm">
            <h1>Create Account</h1>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required placeholder="enter username">

            <label for="fullName">Full Name</label>
            <input type="text" name="fullName" id="fullName" required placeholder="enter full name">

            <label for="email">email</label>
            <input type="email" id="email" name="email" required placeholder="Enter Your Email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="password">

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="confirm Password">

            <button id="submitbtn" type="submit">Register</button>

            <p>
                Already have a Account?
                <a href="login.html">Login</a>
            </p>
            <p id="errorMessage"></p>
        </form>
    </main>

    <script src="js/auth.js"></script>
</body>

</html>
